# Where tools/publish.sh uploads (no secrets here: the FTP login is in ~/.netrc,
# "machine ngcobalt387.manitu.net login ... password ...", chmod 600)
FTP_HOST=ngcobalt387.manitu.net
FTP_DIR=/updates
# What the game fetches (must answer plain http, no redirect to https)
HTTP_URL=http://yardwars.zeromips.org/updates/
# Signing key (outside the repo)
KEY=$HOME/.config/yard-wars/update-key.pem
